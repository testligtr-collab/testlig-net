# Testlig development stack — not for production deployment.
#
# Secrets and credentials come from the environment / .env.local
# (see .env.example). Do not commit real passwords.

name: testlig-net

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: testlig_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:rw
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      # Always use Docker DNS names inside the stack (do not reuse host 127.0.0.1 URLs).
      DATABASE_URL: mysql://${MYSQL_USER:-testlig}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE:-testlig}?serverVersion=10.11.10-MariaDB&charset=utf8mb4
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      LOCK_DSN: ${LOCK_DSN:-flock}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL:-noreply@testlig.local}
      MAILER_FROM_NAME: ${MAILER_FROM_NAME:-Testlig}
      VERIFY_EMAIL_LIFETIME: ${VERIFY_EMAIL_LIFETIME:-86400}
      RESET_PASSWORD_LIFETIME: ${RESET_PASSWORD_LIFETIME:-3600}
      AUDIT_HASH_KEY: ${AUDIT_HASH_KEY:-change_me_dev_audit_hash_not_for_production}
      QUESTION_ANSWER_INTEGRITY_KEY: ${QUESTION_ANSWER_INTEGRITY_KEY:-change_me_dev_question_answer_integrity_not_for_production}
      ATTEMPT_ANSWER_ENCRYPTION_KEY: ${ATTEMPT_ANSWER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ALLOW_SUPER_ADMIN_BOOTSTRAP: ${ALLOW_SUPER_ADMIN_BOOTSTRAP:-0}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - testlig

  web:
    image: nginx:1.27-alpine
    container_name: testlig_web
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - testlig

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: testlig_mailpit
    # UI only on localhost (SMTP stays on the Docker network as mailpit:1025).
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    # Image ships with `mailpit readyz` HEALTHCHECK.
    networks:
      - testlig

  database:
    image: mariadb:10.11
    container_name: testlig_database
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testlig}
      MYSQL_USER: ${MYSQL_USER:-testlig}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.local}
    volumes:
      - testlig_mariadb_data:/var/lib/mysql
      # Runs only on first volume initialization.
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    # No host port publish — avoids clashing with XAMPP MariaDB on 3306.
    # App reaches MariaDB only via the Docker network hostname "database".
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - testlig

  redis:
    image: redis:7-alpine
    container_name: testlig_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - testlig_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - testlig

volumes:
  testlig_mariadb_data:
  testlig_redis_data:

networks:
  testlig:
    driver: bridge
