# Testlig development stack — not for production deployment.
#
# Secrets and credentials come from the environment / .env.local
# (see .env.example). Do not commit real passwords.

name: testlig-net

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: testlig_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:rw
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - testlig

  web:
    image: nginx:1.27-alpine
    container_name: testlig_web
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - testlig

  database:
    image: mariadb:10.11
    container_name: testlig_database
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testlig}
      MYSQL_USER: ${MYSQL_USER:-testlig}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.local}
    volumes:
      - testlig_mariadb_data:/var/lib/mysql
    ports:
      # Bound for local tooling only; omit or restrict in shared environments.
      - "${DATABASE_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - testlig

  redis:
    image: redis:7-alpine
    container_name: testlig_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - testlig_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - testlig

volumes:
  testlig_mariadb_data:
  testlig_redis_data:

networks:
  testlig:
    driver: bridge
