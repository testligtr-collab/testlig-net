name: Ops ClamAV install and isolated acceptance (VDS)

# Manual install and isolated clamd acceptance. The default confirmation does not open SSH.
# This workflow is not itself a completed installation or a live acceptance.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type install-clamav-isolated-accept to run. Any other value stops before SSH."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  pause-notice:
    name: VDS SSH pause notice
    if: vars.VDS_SSH_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pause
        run: |
          echo "VDS SSH operations are paused"
          echo "ClamAV install skipped because SSH paused"
          {
            echo "## ClamAV install skipped because SSH paused"
            echo "No SSH agent, secret, or connection was used."
          } >> "$GITHUB_STEP_SUMMARY"

  not-confirmed:
    name: ClamAV install not confirmed
    if: vars.VDS_SSH_PAUSED != 'true' && github.event.inputs.confirm != 'install-clamav-isolated-accept'
    runs-on: ubuntu-latest
    steps:
      - name: Report missing confirmation
        run: echo "ClamAV install not confirmed"

  vds:
    name: VDS ClamAV install and isolated acceptance
    if: vars.VDS_SSH_PAUSED != 'true' && github.event.inputs.confirm == 'install-clamav-isolated-accept'
    runs-on: ubuntu-latest
    concurrency:
      group: testlig-vds-ssh
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
        run: bash deploy/vds/gha-ssh-config.sh

      - name: Install ClamAV and run isolated acceptance
        run: |
          set -euo pipefail
          set +e
          expected_sha="$(git -C . rev-parse HEAD)"
          accept_b64="$(base64 -w0 deploy/vds/gha-clamav-accept.php)"
          ssh testlig-vds "export EXPECTED_SHA=$(printf %q "$expected_sha"); export ACCEPT_PHP_B64=$(printf %q "$accept_b64"); bash -s" < deploy/vds/gha-clamav-install-remote.sh
          status=$?
          bash deploy/vds/gha-ssh-close-master.sh
          close_status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$close_status" -ne 0 ]; then
            exit "$close_status"
          fi
