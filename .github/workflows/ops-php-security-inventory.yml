name: Ops PHP security inventory (VDS)

# Manual read-only PHP security inventory.
# One SSH session. It does not change settings, packages, or services.
# CLI output and ini files are not web-runtime acceptance.
# A configured handler is not recorded as internet-facing.
# Dispatch is a later measurement. This file does not run the inventory.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pause-notice:
    name: VDS SSH pause notice
    if: vars.VDS_SSH_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pause
        run: |
          echo "VDS SSH operations are paused"
          echo "PHP security inventory skipped because SSH paused"
          {
            echo "## PHP security inventory skipped because SSH paused"
            echo "No SSH agent, secret, or connection was used."
          } >> "$GITHUB_STEP_SUMMARY"

  vds:
    name: VDS PHP security inventory
    if: vars.VDS_SSH_PAUSED != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: testlig-vds-ssh
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
        run: bash deploy/vds/gha-ssh-config.sh

      - name: Run remote read-only inventory
        run: |
          set -euo pipefail
          set +e
          ssh testlig-vds bash -s < deploy/vds/gha-php-security-inventory-remote.sh
          status=$?
          bash deploy/vds/gha-ssh-close-master.sh
          close_status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$close_status" -ne 0 ]; then
            exit "$close_status"
          fi
