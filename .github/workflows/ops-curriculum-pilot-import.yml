name: Ops curriculum pilot import (VDS)

# Imports TYMM pilot curriculum outcome slice. dry-run default; apply = write.
# Never prints secrets/PII. Does not create LearningContent or placements.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run | apply | verify"
        type: choice
        options:
          - dry-run
          - apply
          - verify
        default: dry-run

permissions:
  contents: read

concurrency:
  group: ops-curriculum-pilot-import
  cancel-in-progress: false

jobs:
  vds:
    name: VDS curriculum pilot import
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Trust host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VDS_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run remote curriculum pilot ops
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          REMOTE="${VDS_USER}@${VDS_HOST}"
          ssh "$REMOTE" "export MODE=$(printf %q "$MODE"); bash -s" <<'EOS'
          set -euo pipefail
          APP_ROOT=/home/testlig.net/app
          PHP_BIN=/usr/local/lsws/lsphp83/bin/php
          APP_USER=testl3865
          FIXTURE=data/curriculum/meb/tymm-2026/grade-1-matematik-uzamsal-iliskiler.yaml
          cd "$APP_ROOT"
          run_app() {
            runuser -u "$APP_USER" -- env HOME=/home/testlig.net APP_ENV=prod "$@"
          }
          sql_count() {
            local sql="$1"
            local out rc
            set +e
            out="$(run_app "$PHP_BIN" bin/console dbal:run-sql --no-interaction "$sql" 2>/tmp/testlig-cpi-sql.err)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "err"
              return 0
            fi
            printf '%s\n' "$out" | tr -d '\r' | awk '
              /^[[:space:]]*[0-9]+[[:space:]]*$/ { v=$1 }
              END { if (v != "") print v; else print "err" }
            '
          }

          echo "mode=${MODE}"
          echo "revision=$(basename "$(readlink -f "$APP_ROOT")")"
          echo "fixture_present=$([ -f "$FIXTURE" ] && echo 1 || echo 0)"
          echo "command_present=$([ -f bin/console ] && run_app "$PHP_BIN" bin/console list --raw 2>/dev/null | grep -c '^app:curriculum:import-pilot-outcome' || echo 0)"

          if [ "$MODE" = "verify" ]; then
            echo "subjects_mat_active=$(sql_count "SELECT COUNT(*) AS c FROM subjects WHERE code = 'matematik' AND status = 'active'")"
            echo "catalog_mat_mapped=$(sql_count "SELECT COUNT(*) AS c FROM catalog_subjects WHERE grade_level = 1 AND slug = 'matematik' AND canonical_subject_id IS NOT NULL")"
            echo "programs_mat_grade1=$(sql_count "SELECT COUNT(*) AS c FROM curriculum_programs p INNER JOIN subjects s ON s.id = p.subject_id WHERE s.code = 'matematik' AND p.grade_level = 1 AND p.code = 'mat_grade1_tymm' AND p.version = 'TYMM-2026'")"
            echo "programs_published=$(sql_count "SELECT COUNT(*) AS c FROM curriculum_programs p INNER JOIN subjects s ON s.id = p.subject_id WHERE s.code = 'matematik' AND p.grade_level = 1 AND p.code = 'mat_grade1_tymm' AND p.version = 'TYMM-2026' AND p.status = 'published'")"
            echo "outcomes_mat_1_3_1_active=$(sql_count "SELECT COUNT(*) AS c FROM curriculum_learning_outcomes o INNER JOIN curriculum_programs p ON p.id = o.curriculum_program_id INNER JOIN subjects s ON s.id = p.subject_id WHERE s.code = 'matematik' AND o.code = 'mat_1_3_1' AND o.status = 'active'")"
            echo "learning_contents=$(sql_count "SELECT COUNT(*) AS c FROM learning_contents")"
            echo "catalog_topic_lessons=$(sql_count "SELECT COUNT(*) AS c FROM catalog_topic_lessons")"
            echo "mat_grade1_topics=$(sql_count "SELECT COUNT(*) AS c FROM catalog_topics t INNER JOIN catalog_units u ON u.id = t.unit_id INNER JOIN catalog_subjects s ON s.id = u.subject_id WHERE s.source_version = 'TYMM-2026' AND s.source_code = 'MAT' AND s.grade_level = 1 AND t.status = 'published'")"
            hl=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 -H 'Host: testlig.net' http://127.0.0.1/health 2>/dev/null || echo err)
            echo "health_local=${hl}"
            exit 0
          fi

          [ -f "$FIXTURE" ] || { echo "ERROR: fixture missing"; exit 1; }
          ARGS=(bin/console app:curriculum:import-pilot-outcome --no-interaction --file="$FIXTURE")
          if [ "$MODE" = "apply" ]; then
            ARGS+=(--apply)
          elif [ "$MODE" != "dry-run" ]; then
            echo "ERROR: unknown mode"
            exit 1
          fi
          run_app "$PHP_BIN" "${ARGS[@]}"
          EOS

      - name: External HTTP smoke (secret-free)
        if: inputs.mode == 'verify'
        run: |
          set -euo pipefail
          health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://testlig.net/health || echo err)
          echo "health_external=${health}"
          test "${health}" = "403"
