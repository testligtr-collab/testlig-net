name: Ops OpenLiteSpeed refresh (VDS)

# Manual refresh of the workers serving the current release.
# The default confirmation does not open SSH.
# This workflow does not create a release and does not itself prove a live refresh.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type refresh-current-ols to run. Any other value stops before SSH."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  pause-notice:
    name: VDS SSH pause notice
    if: vars.VDS_SSH_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pause
        run: |
          echo "VDS SSH operations are paused"
          echo "OpenLiteSpeed refresh skipped because SSH paused"
          {
            echo "## OpenLiteSpeed refresh skipped because SSH paused"
            echo "No SSH agent, secret, or connection was used."
          } >> "$GITHUB_STEP_SUMMARY"

  not-confirmed:
    name: OpenLiteSpeed refresh not confirmed
    if: vars.VDS_SSH_PAUSED != 'true' && github.event.inputs.confirm != 'refresh-current-ols'
    runs-on: ubuntu-latest
    steps:
      - name: Report missing confirmation
        run: echo "OpenLiteSpeed refresh not confirmed"

  vds:
    name: VDS OpenLiteSpeed refresh
    if: vars.VDS_SSH_PAUSED != 'true' && github.event.inputs.confirm == 'refresh-current-ols'
    runs-on: ubuntu-latest
    concurrency:
      group: testlig-vds-ssh
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
        run: bash deploy/vds/gha-ssh-config.sh

      - name: Refresh current OpenLiteSpeed workers
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          set +e
          ssh testlig-vds "export EXPECTED_SHA=$(printf '%q' "$sha"); bash -s" < deploy/vds/gha-ols-refresh-remote.sh
          status=$?
          bash deploy/vds/gha-ssh-close-master.sh
          close_status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$close_status" -ne 0 ]; then
            exit "$close_status"
          fi
          set -e
          apex="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://testlig.net/")"
          printf 'external_apex=%s\n' "$apex"
          test "$apex" = "200"
          www="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://www.testlig.net/")"
          printf 'external_www=%s\n' "$www"
          test "$www" = "200"
