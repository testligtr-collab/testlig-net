name: Ops ClamAV socket group (VDS)

# Manual apply or restore of testl3865 membership in the existing virusgroup.
# Default confirmation is empty, so a dispatch does not connect.
# Apply and restore use different confirmation values.
# A green run is not web, SELinux, loaded-signature, or student-serving acceptance.
# Preparing this workflow is not permission to dispatch it.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "apply or restore"
        type: choice
        options:
          - apply
          - restore
        default: restore
      confirm:
        description: "apply-clamav-socket-group or restore-clamav-socket-group. Any other value stops before SSH."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  pause-notice:
    name: VDS SSH pause notice
    if: vars.VDS_SSH_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pause
        run: |
          echo "VDS SSH operations are paused"
          echo "ClamAV socket group skipped because SSH paused"
          {
            echo "## ClamAV socket group skipped because SSH paused"
            echo "No SSH agent, secret, or connection was used."
          } >> "$GITHUB_STEP_SUMMARY"

  not-confirmed:
    name: ClamAV socket group not confirmed
    if: >-
      vars.VDS_SSH_PAUSED != 'true' &&
      (github.event.inputs.mode != 'apply' || github.event.inputs.confirm != 'apply-clamav-socket-group') &&
      (github.event.inputs.mode != 'restore' || github.event.inputs.confirm != 'restore-clamav-socket-group')
    runs-on: ubuntu-latest
    steps:
      - name: Report missing confirmation
        run: echo "ClamAV socket group not confirmed"

  vds:
    name: VDS ClamAV socket group
    if: >-
      vars.VDS_SSH_PAUSED != 'true' &&
      (
        (github.event.inputs.mode == 'apply' && github.event.inputs.confirm == 'apply-clamav-socket-group') ||
        (github.event.inputs.mode == 'restore' && github.event.inputs.confirm == 'restore-clamav-socket-group')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: testlig-vds-ssh
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
        run: bash deploy/vds/gha-ssh-config.sh

      - name: Apply or restore the socket group
        env:
          CLAMAV_GROUP_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          set +e
          expected_sha="$(git rev-parse HEAD)"
          probe_b64="$(base64 -w0 deploy/vds/gha-clamav-access-probe.php)"
          ssh testlig-vds "export EXPECTED_SHA=$(printf %q "$expected_sha"); export CLAMAV_GROUP_MODE=$(printf %q "$CLAMAV_GROUP_MODE"); export ACCESS_PROBE_PHP_B64=$(printf %q "$probe_b64"); bash -s" < deploy/vds/gha-clamav-socket-group-remote.sh
          status=$?
          bash deploy/vds/gha-ssh-close-master.sh
          close_status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$close_status" -ne 0 ]; then
            exit "$close_status"
          fi
