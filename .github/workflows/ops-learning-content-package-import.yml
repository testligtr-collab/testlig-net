name: Ops learning content package import (VDS)

# Closed lesson-package importer. verify is the default.
# Does not import questions, review, seal, publish, or place content.
# Actor email comes from repository secret TESTLIG_CONTENT_ACTOR_EMAIL for this
# one SSH session only. The first SSH stdin line is the secret; the remote
# command reads it, exports it, then runs the remaining stdin with bash -se.
# Mode and package are allowlisted exports, not stdin data lines.
# The secret is not written to a VDS env file.
# Dispatch is manual. This workflow does not run from deploy.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify | dry-run | apply"
        type: choice
        options:
          - verify
          - dry-run
          - apply
        default: verify
      package:
        description: "Allowlisted package directory"
        type: choice
        options:
          - data/content/tymm-2026/grade-1/matematik/mat-1-3-2
          - data/content/tymm-2026/grade-1/matematik/mat-1-3-3
        default: data/content/tymm-2026/grade-1/matematik/mat-1-3-2
      expected_plan_fingerprint:
        description: "Required for apply: dry-run plan fingerprint. Not an email or secret."
        type: string
        required: false

permissions:
  contents: read

jobs:
  pause-notice:
    name: VDS SSH pause notice
    if: vars.VDS_SSH_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pause
        run: echo "VDS SSH operations are paused"

  refuse-apply-without-plan:
    name: Refuse apply without plan
    if: inputs.mode == 'apply' && inputs.expected_plan_fingerprint == ''
    runs-on: ubuntu-latest
    steps:
      - name: Stop
        run: |
          echo "apply requires the dry-run plan fingerprint"
          exit 1

  guard:
    name: Check dispatch inputs
    if: vars.VDS_SSH_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsafe inputs before SSH
        env:
          MODE: ${{ inputs.mode }}
          PLAN: ${{ inputs.expected_plan_fingerprint }}
          PACKAGE: ${{ inputs.package }}
          ACTOR_EMAIL: ${{ secrets.TESTLIG_CONTENT_ACTOR_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${ACTOR_EMAIL}" ]; then
            echo "actor secret is not configured"
            exit 1
          fi
          case "$ACTOR_EMAIL" in
            *$'\r'*|*$'\n'*)
              echo "actor secret is not configured"
              exit 1
              ;;
          esac
          echo "::add-mask::${ACTOR_EMAIL}"
          case "$MODE" in
            verify|dry-run|apply) ;;
            *)
              echo "ERROR: unknown mode"
              exit 1
              ;;
          esac
          case "$PACKAGE" in
            data/content/tymm-2026/grade-1/matematik/mat-1-3-2|data/content/tymm-2026/grade-1/matematik/mat-1-3-3) ;;
            *)
              echo "package is not allowlisted"
              exit 1
              ;;
          esac
          if [ "$MODE" = "apply" ] && ! printf '%s' "$PLAN" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "apply requires the dry-run plan fingerprint"
            exit 1
          fi

  vds:
    name: VDS learning content package import
    needs: [guard, refuse-apply-without-plan]
    if: always() && needs.guard.result == 'success' && (needs.refuse-apply-without-plan.result == 'success' || needs.refuse-apply-without-plan.result == 'skipped') && vars.VDS_SSH_PAUSED != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: testlig-vds-ssh
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
        run: bash deploy/vds/gha-ssh-config.sh

      - name: Run remote package import
        env:
          MODE: ${{ inputs.mode }}
          PLAN: ${{ inputs.expected_plan_fingerprint }}
          PACKAGE: ${{ inputs.package }}
          TESTLIG_CONTENT_ACTOR_EMAIL: ${{ secrets.TESTLIG_CONTENT_ACTOR_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${TESTLIG_CONTENT_ACTOR_EMAIL}" ]; then
            echo "actor secret is not configured"
            exit 1
          fi
          case "$TESTLIG_CONTENT_ACTOR_EMAIL" in
            *$'\r'*|*$'\n'*)
              echo "actor secret is not configured"
              exit 1
              ;;
          esac
          echo "::add-mask::${TESTLIG_CONTENT_ACTOR_EMAIL}"
          case "$MODE" in
            verify|dry-run|apply) ;;
            *)
              echo "ERROR: unknown mode"
              exit 1
              ;;
          esac
          case "$PACKAGE" in
            data/content/tymm-2026/grade-1/matematik/mat-1-3-2|data/content/tymm-2026/grade-1/matematik/mat-1-3-3) ;;
            *)
              echo "package is not allowlisted"
              exit 1
              ;;
          esac
          if [ "$MODE" = "apply" ] && ! printf '%s' "$PLAN" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "apply requires the dry-run plan fingerprint"
            exit 1
          fi
          ENTRY="$(cat deploy/vds/gha-learning-content-package-import-entry.sh)"
          set +e
          ssh testlig-vds "export MODE=$(printf %q "$MODE"); export PLAN=$(printf %q "$PLAN"); export PACKAGE=$(printf %q "$PACKAGE")
          $ENTRY" < <(
            printf '%s\n' "$TESTLIG_CONTENT_ACTOR_EMAIL"
            cat deploy/vds/gha-learning-content-package-import-remote.sh
          )
          status=$?
          bash deploy/vds/gha-ssh-close-master.sh
          close_status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$close_status" -ne 0 ]; then
            exit "$close_status"
          fi
