name: Ops web runtime identity window (VDS)

# Manual open or restore of only WEB_RUNTIME_IDENTITY_ENABLED and
# WEB_RUNTIME_IDENTITY_EXPIRES_AT. The expiry gate closes diagnostic access
# by itself and does not restore env files. This workflow does not send HTTP
# or an identity POST. It does not read process variables or the command line, and it
# does not change OLS, groups, ACL, or any other setting.
# Env files are replaced atomically. The recovery record is root-owned mode 0600,
# and its directory must not allow another user to replace that record.
# A green run is not a live web identity measurement.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "open or restore"
        type: choice
        options:
          - open
          - restore
        default: restore
      confirm:
        description: "open-web-runtime-identity or restore-web-runtime-identity. Any other value stops before SSH."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  pause-notice:
    name: VDS SSH pause notice
    if: vars.VDS_SSH_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pause
        run: |
          echo "VDS SSH operations are paused"
          echo "Web runtime identity window skipped because SSH paused"
          {
            echo "## Web runtime identity window skipped because SSH paused"
            echo "No SSH agent, secret, or connection was used."
          } >> "$GITHUB_STEP_SUMMARY"

  not-confirmed:
    name: Web runtime identity window not confirmed
    if: >-
      vars.VDS_SSH_PAUSED != 'true' &&
      (github.event.inputs.mode != 'open' || github.event.inputs.confirm != 'open-web-runtime-identity') &&
      (github.event.inputs.mode != 'restore' || github.event.inputs.confirm != 'restore-web-runtime-identity')
    runs-on: ubuntu-latest
    steps:
      - name: Report missing confirmation
        run: echo "Web runtime identity window not confirmed"

  vds:
    name: VDS web runtime identity window
    if: >-
      vars.VDS_SSH_PAUSED != 'true' &&
      (
        (github.event.inputs.mode == 'open' && github.event.inputs.confirm == 'open-web-runtime-identity') ||
        (github.event.inputs.mode == 'restore' && github.event.inputs.confirm == 'restore-web-runtime-identity')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: testlig-vds-ssh
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
        run: bash deploy/vds/gha-ssh-config.sh

      - name: Open or restore the identity window
        env:
          IDENTITY_WINDOW_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          set +e
          expected_sha="$(git rev-parse HEAD)"
          ssh testlig-vds "export EXPECTED_SHA=$(printf %q "$expected_sha"); export IDENTITY_WINDOW_MODE=$(printf %q "$IDENTITY_WINDOW_MODE"); bash -s" < deploy/vds/gha-web-runtime-identity-window-remote.sh
          status=$?
          bash deploy/vds/gha-ssh-close-master.sh
          close_status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$close_status" -ne 0 ]; then
            exit "$close_status"
          fi
