name: Ops catalog publish-tree (VDS)

# Manual-only publish of TYMM-2026 grade-1 MAT tree. Never runs on push.
# Modes: preflight (dry-run) | apply | verify. Secrets are never printed.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight | apply | verify"
        type: choice
        options:
          - preflight
          - apply
          - verify
        default: preflight

permissions:
  contents: read

jobs:
  pause-notice:
    name: VDS SSH pause notice
    if: vars.VDS_SSH_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pause
        run: |
          echo "VDS SSH operations are paused"

  vds:
    name: VDS catalog publish-tree
    if: vars.VDS_SSH_PAUSED != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: testlig-vds-ssh
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
        run: bash deploy/vds/gha-ssh-config.sh

      - name: Run remote publish-tree ops
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          set +e
          ssh testlig-vds "export MODE=$(printf %q "$MODE"); bash -s" <<'EOS'
          set -euo pipefail
          APP_ROOT=/home/testlig.net/app
          PHP_BIN=/usr/local/lsws/lsphp83/bin/php
          APP_USER=testl3865
          cd "$APP_ROOT"
          run_app() {
            runuser -u "$APP_USER" -- env HOME=/home/testlig.net APP_ENV=prod "$@"
          }
          sql_count() {
            local sql="$1"
            local out rc
            set +e
            out="$(run_app "$PHP_BIN" bin/console dbal:run-sql --no-interaction "$sql" 2>/tmp/testlig-cat-pub-sql.err)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "err"
              return 0
            fi
            printf '%s\n' "$out" | tr -d '\r' | awk '
              /^[[:space:]]*[0-9]+[[:space:]]*$/ { v=$1 }
              END { if (v != "") print v; else print "err" }
            '
          }

          echo "mode=${MODE}"
          echo "revision=$(basename "$(readlink -f "$APP_ROOT")")"

          if [ "$MODE" = "verify" ]; then
            echo "published_subjects=$(sql_count "SELECT COUNT(*) AS c FROM catalog_subjects WHERE source_version = 'TYMM-2026' AND source_code = 'MAT' AND status = 'published'")"
            echo "published_units=$(sql_count "SELECT COUNT(*) AS c FROM catalog_units WHERE source_version = 'TYMM-2026' AND status = 'published'")"
            echo "published_topics=$(sql_count "SELECT COUNT(*) AS c FROM catalog_topics WHERE source_version = 'TYMM-2026' AND status = 'published'")"
            echo "draft_subjects=$(sql_count "SELECT COUNT(*) AS c FROM catalog_subjects WHERE source_version = 'TYMM-2026' AND source_code = 'MAT' AND status = 'draft'")"
            echo "draft_units=$(sql_count "SELECT COUNT(*) AS c FROM catalog_units WHERE source_version = 'TYMM-2026' AND status = 'draft'")"
            echo "draft_topics=$(sql_count "SELECT COUNT(*) AS c FROM catalog_topics WHERE source_version = 'TYMM-2026' AND status = 'draft'")"
            echo "archived_subjects=$(sql_count "SELECT COUNT(*) AS c FROM catalog_subjects WHERE source_version = 'TYMM-2026' AND source_code = 'MAT' AND status = 'archived'")"
            echo "archived_units=$(sql_count "SELECT COUNT(*) AS c FROM catalog_units WHERE source_version = 'TYMM-2026' AND status = 'archived'")"
            echo "archived_topics=$(sql_count "SELECT COUNT(*) AS c FROM catalog_topics WHERE source_version = 'TYMM-2026' AND status = 'archived'")"
            echo "grade1_published_subjects=$(sql_count "SELECT COUNT(*) AS c FROM catalog_subjects WHERE grade_level = 1 AND status = 'published'")"
            echo "mat_grade1_published=$(sql_count "SELECT COUNT(*) AS c FROM catalog_subjects WHERE source_version = 'TYMM-2026' AND source_code = 'MAT' AND grade_level = 1 AND status = 'published' AND slug = 'matematik'")"
            echo "mat_grade1_units=$(sql_count "SELECT COUNT(*) AS c FROM catalog_units u INNER JOIN catalog_subjects s ON s.id = u.subject_id WHERE s.source_version = 'TYMM-2026' AND s.source_code = 'MAT' AND s.grade_level = 1 AND u.status = 'published'")"
            echo "mat_grade1_topics=$(sql_count "SELECT COUNT(*) AS c FROM catalog_topics t INNER JOIN catalog_units u ON u.id = t.unit_id INNER JOIN catalog_subjects s ON s.id = u.subject_id WHERE s.source_version = 'TYMM-2026' AND s.source_code = 'MAT' AND s.grade_level = 1 AND t.status = 'published'")"
            echo "catalog_topic_lessons=$(sql_count "SELECT COUNT(*) AS c FROM catalog_topic_lessons")"
            echo "learning_contents=$(sql_count "SELECT COUNT(*) AS c FROM learning_contents")"
            echo "institutions=$(sql_count "SELECT COUNT(*) AS c FROM institutions")"
            echo "institution_memberships=$(sql_count "SELECT COUNT(*) AS c FROM institution_memberships")"
            echo "classrooms=$(sql_count "SELECT COUNT(*) AS c FROM classrooms")"
            echo "institution_teacher_invitations=$(sql_count "SELECT COUNT(*) AS c FROM institution_teacher_invitations")"
            echo "classroom_teacher_assignments=$(sql_count "SELECT COUNT(*) AS c FROM classroom_teacher_assignments")"
            echo "institution_student_invitations=$(sql_count "SELECT COUNT(*) AS c FROM institution_student_invitations")"
            echo "classroom_student_enrollments=$(sql_count "SELECT COUNT(*) AS c FROM classroom_student_enrollments")"
            echo "questions=$(sql_count "SELECT COUNT(*) AS c FROM questions")"
            echo "assessments=$(sql_count "SELECT COUNT(*) AS c FROM assessments")"
            echo "assessment_items=$(sql_count "SELECT COUNT(*) AS c FROM assessment_items")"
            echo "attempts=$(sql_count "SELECT COUNT(*) AS c FROM assessment_attempts")"
            echo "attempt_answers=$(sql_count "SELECT COUNT(*) AS c FROM assessment_attempt_answers")"
            echo "parent_student_link_codes=$(sql_count "SELECT COUNT(*) AS c FROM parent_student_link_codes")"
            echo "parent_student_links=$(sql_count "SELECT COUNT(*) AS c FROM parent_student_links")"
            echo "parent_student_link_active_guards=$(sql_count "SELECT COUNT(*) AS c FROM parent_student_link_active_guards")"
            echo "users=$(sql_count "SELECT COUNT(*) AS c FROM users")"
            # Local health (OpenLiteSpeed / virtual host). Prefer Host header; fall back to plain loopback.
            set +e
            hl=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 -H 'Host: testlig.net' http://127.0.0.1/health 2>/dev/null)
            hl_rc=$?
            if [ "$hl_rc" -ne 0 ] || [ -z "$hl" ]; then
              hl=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1/health 2>/dev/null || echo err)
            fi
            set -e
            echo "health_local=${hl}"
            echo "dersler_anon=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 -H 'Host: testlig.net' http://127.0.0.1/ogrenci/dersler 2>/dev/null || echo err)"
            echo "home_local=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 -H 'Host: testlig.net' http://127.0.0.1/ 2>/dev/null || echo err)"
            echo "giris_local=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 -H 'Host: testlig.net' http://127.0.0.1/giris 2>/dev/null || echo err)"
            echo "kurum_local=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 -H 'Host: testlig.net' http://127.0.0.1/kurum/ogretmenler 2>/dev/null || echo err)"
            echo "kurum_ogrenci_local=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 -H 'Host: testlig.net' http://127.0.0.1/kurum/ogrenciler 2>/dev/null || echo err)"
            echo "davet_local=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 -H 'Host: testlig.net' http://127.0.0.1/davet/ogretmen 2>/dev/null || echo err)"
            echo "davet_ogrenci_local=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 -H 'Host: testlig.net' http://127.0.0.1/davet/ogrenci 2>/dev/null || echo err)"
            exit 0
          fi

          ARGS=(
            bin/console app:catalog:publish-tree --no-interaction
            --source-version=TYMM-2026
            --subject-code=MAT
            --expected-subjects=1
            --expected-units=7
            --expected-topics=19
            --grade=1
          )
          if [ "$MODE" = "apply" ]; then
            ARGS+=(--apply)
          elif [ "$MODE" != "preflight" ]; then
            echo "ERROR: unknown mode"
            exit 1
          fi

          run_app "$PHP_BIN" "${ARGS[@]}"
          EOS
          status=$?
          bash deploy/vds/gha-ssh-close-master.sh
          close_status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$close_status" -ne 0 ]; then
            exit "$close_status"
          fi

      - name: External HTTP smoke (secret-free)
        if: inputs.mode == 'verify'
        run: |
          set -euo pipefail
          health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://testlig.net/health || echo err)
          dersler=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://testlig.net/ogrenci/dersler || echo err)
          kurum=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://testlig.net/kurum/ogretmenler || echo err)
          kurum_ogrenci=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://testlig.net/kurum/ogrenciler || echo err)
          davet=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://testlig.net/davet/ogretmen || echo err)
          davet_ogrenci=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://testlig.net/davet/ogrenci || echo err)
          echo "health_external=${health}"
          echo "dersler_external=${dersler}"
          echo "kurum_ogretmenler_external=${kurum}"
          echo "kurum_ogrenciler_external=${kurum_ogrenci}"
          echo "davet_external=${davet}"
          echo "davet_ogrenci_external=${davet_ogrenci}"
          test "${health}" = "403"
          test "${dersler}" = "302"
          test "${kurum}" = "302"
          test "${kurum_ogrenci}" = "302"
          test "${davet_ogrenci}" = "200"
