name: Ops ClamAV application connection (VDS)

# Manual apply or restore of the question-image ClamAV settings and the
# short connection-check gate. A green run is a file operation, not web
# acceptance. This workflow does not change group membership.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "apply or restore"
        type: choice
        options:
          - apply
          - restore
        default: restore
      confirm:
        description: "apply-clamav-app-connection or restore-clamav-app-connection. Any other value stops before SSH."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  pause-notice:
    name: VDS SSH pause notice
    if: vars.VDS_SSH_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pause
        run: |
          echo "VDS SSH operations are paused"
          echo "ClamAV application connection skipped because SSH paused"
          {
            echo "## ClamAV application connection skipped because SSH paused"
            echo "No SSH agent, secret, or connection was used."
          } >> "$GITHUB_STEP_SUMMARY"

  not-confirmed:
    name: ClamAV application connection not confirmed
    if: >-
      vars.VDS_SSH_PAUSED != 'true' &&
      (github.event.inputs.mode != 'apply' || github.event.inputs.confirm != 'apply-clamav-app-connection') &&
      (github.event.inputs.mode != 'restore' || github.event.inputs.confirm != 'restore-clamav-app-connection')
    runs-on: ubuntu-latest
    steps:
      - name: Report missing confirmation
        run: echo "ClamAV application connection not confirmed"

  vds:
    name: VDS ClamAV application connection
    if: >-
      vars.VDS_SSH_PAUSED != 'true' &&
      (
        (github.event.inputs.mode == 'apply' && github.event.inputs.confirm == 'apply-clamav-app-connection') ||
        (github.event.inputs.mode == 'restore' && github.event.inputs.confirm == 'restore-clamav-app-connection')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: testlig-vds-ssh
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
        run: bash deploy/vds/gha-ssh-config.sh

      - name: Apply or restore the ClamAV application connection
        env:
          CLAMAV_LINK_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          set +e
          expected_sha="$(git rev-parse HEAD)"
          ssh testlig-vds "export EXPECTED_SHA=$(printf %q "$expected_sha"); export CLAMAV_LINK_MODE=$(printf %q "$CLAMAV_LINK_MODE"); bash -s" < deploy/vds/gha-clamav-app-connection-remote.sh
          status=$?
          bash deploy/vds/gha-ssh-close-master.sh
          close_status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$close_status" -ne 0 ]; then
            exit "$close_status"
          fi
