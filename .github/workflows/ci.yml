name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_DATABASE: testlig_test
          MYSQL_USER: testlig
          MYSQL_PASSWORD: testlig_ci
          MYSQL_ROOT_PASSWORD: root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5

    env:
      APP_ENV: test
      APP_SECRET: ci_test_secret_not_for_production
      DATABASE_URL: "mysql://testlig:testlig_ci@127.0.0.1:3306/testlig?serverVersion=10.11.10-MariaDB&charset=utf8mb4"
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: sync://
      LOCK_DSN: flock
      DEFAULT_URI: http://localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql, zip, opcache, redis
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security audit
        run: composer audit --no-interaction

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --ansi

      - name: Warmup Symfony cache (dev container XML for PHPStan)
        env:
          APP_ENV: dev
        run: php bin/console cache:warmup --no-interaction

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Lint Symfony container
        env:
          APP_ENV: test
        run: php bin/console lint:container --no-interaction

      - name: Validate Doctrine schema / mapping
        run: php bin/console doctrine:schema:validate --skip-sync --no-interaction

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always
