name: Deploy VDS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA). Empty = this workflow revision."
        required: false
        type: string
        default: ""
  # Auto-deploy only after CI succeeds on main, and only when SSH is not paused.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  pause-notice:
    name: VDS SSH pause notice
    if: vars.VDS_SSH_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pause
        run: |
          echo "VDS SSH operations are paused"
          echo "Deploy skipped because SSH paused"
          {
            echo "## Deploy skipped because SSH paused"
            echo "VDS SSH operations are paused. No SSH agent, secret, or connection was used."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to VDS
    runs-on: ubuntu-latest
    # Manual or auto. Both require the pause to be off. Auto also requires CI success and VDS_AUTO_DEPLOY.
    if: >-
      vars.VDS_SSH_PAUSED != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        vars.VDS_AUTO_DEPLOY == 'true'))
    concurrency:
      group: testlig-vds-ssh
      cancel-in-progress: false
      queue: max
    steps:
      - name: Resolve deploy SHA
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            REF="$SHA"
          elif [ -n "${{ github.event.inputs.ref }}" ]; then
            REF="${{ github.event.inputs.ref }}"
            SHA=""
          else
            REF="${{ github.sha }}"
            SHA="${{ github.sha }}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "sha_hint=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow helpers
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: workflow-src

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 1
          path: release-src

      - name: Record SHA
        id: rev
        working-directory: release-src
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${SHA}"

      - name: Build release tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/testlig-release
          tar -czf /tmp/testlig-release/release.tgz \
            --exclude='./.git' \
            --exclude='./vendor' \
            --exclude='./var' \
            --exclude='./node_modules' \
            --exclude='./.env.local' \
            --exclude='./.env.*.local' \
            --exclude='./compose.override.yaml' \
            --exclude='./docker/php/php.local.ini' \
            --exclude='./public/uploads' \
            --exclude='./public/assets' \
            --exclude='./.phpunit.cache' \
            --exclude='./.php-cs-fixer.cache' \
            -C release-src .
          ls -lh /tmp/testlig-release/release.tgz

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
        run: bash workflow-src/deploy/vds/gha-ssh-config.sh

      - name: Upload bundle and activate release
        env:
          DEPLOY_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          bash workflow-src/deploy/vds/gha-deploy-once.sh \
            "${DEPLOY_SHA}" \
            /tmp/testlig-release/release.tgz \
            release-src/deploy/vds/release-deploy.sh \
            release-src/deploy/vds/rollback.sh

      - name: External smoke (apex + auth pages)
        run: |
          set -euo pipefail
          for path in / /giris /kayit /gizlilik /kullanim-kosullari /cerez-politikasi /cocuk-ve-veli-bilgilendirmesi /dersler /sitemap.xml; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://testlig.net${path}")
            echo "https://testlig.net${path} -> ${code}"
            test "$code" = "200"
          done
          www=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://www.testlig.net/")
          echo "https://www.testlig.net/ -> ${www}"
          test "$www" = "200"
