name: Ops homework PDF inventory (VDS)

# Manual, read-only homework PDF storage inventory and scan-readiness preview.
# One SSH session. It verifies that the active release carries the expected full SHA, runs
# `app:homework-pdf:inventory` once from that release, and reports allowlisted counters and measurements.
# It does not deploy, install, create a directory, delete or move a file, write the database, change a
# flag, a service or a setting, upload a PDF, or scan a sample. PDF upload and the scan gate stay closed.
# The expected SHA is the release that must be live (its REVISION file). It is not the SHA of this file.
# A green run is a point-in-time preview. It is not quota, retention, or upload acceptance.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full 40-character lowercase SHA of the release that must be live. Any other value stops before SSH."
        required: true
        type: string

permissions:
  contents: read

jobs:
  pause-notice:
    name: VDS SSH pause notice
    if: vars.VDS_SSH_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pause
        run: |
          echo "VDS SSH operations are paused"
          echo "Homework PDF inventory skipped because SSH paused"
          {
            echo "## Homework PDF inventory skipped because SSH paused"
            echo "No SSH agent, secret, or connection was used."
          } >> "$GITHUB_STEP_SUMMARY"

  vds:
    name: VDS homework PDF inventory
    if: vars.VDS_SSH_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: testlig-vds-ssh
      cancel-in-progress: false
      queue: max
    steps:
      - name: Validate expected release SHA (before any SSH)
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "${#EXPECTED_SHA}" -ne 40 ] || ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full 40-character lowercase hex SHA. Stopping before SSH."
            exit 1
          fi
          echo "expected_sha_format=ok"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KNOWN_HOSTS: ${{ secrets.VDS_SSH_KNOWN_HOSTS }}
        run: bash deploy/vds/gha-ssh-config.sh

      - name: Run remote read-only inventory and readiness preview
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -uo pipefail
          umask 077
          out="${RUNNER_TEMP}/homework-pdf-inventory.out"
          err="${RUNNER_TEMP}/homework-pdf-inventory.err"
          # Cleanup is registered before the connection and runs on every exit path. It keeps the original
          # exit status; it only turns a success into a failure when a mandatory cleanup step failed.
          cleanup() {
            rc=$?
            trap - EXIT
            close_status=0
            bash deploy/vds/gha-ssh-close-master.sh > /dev/null 2>&1 || close_status=$?
            rm_status=0
            rm -f "$out" "$err" || rm_status=$?
            leftover=no
            if [ -e "$out" ] || [ -e "$err" ]; then
              leftover=yes
            fi
            echo "master_close_exit=${close_status}"
            echo "temp_cleanup_exit=${rm_status}"
            echo "temp_files_left=${leftover}"
            if [ "$rc" -eq 0 ] && { [ "$close_status" -ne 0 ] || [ "$rm_status" -ne 0 ] || [ "$leftover" = yes ]; }; then
              echo "::error::Mandatory cleanup failed; the run is not reported as successful."
              exit 1
            fi
            exit "$rc"
          }
          trap cleanup EXIT
          : > "$out"
          : > "$err"
          ssh_status=0
          ssh testlig-vds "export EXPECTED_SHA=$(printf %q "$EXPECTED_SHA"); bash -s" < deploy/vds/gha-homework-pdf-inventory-remote.sh > "$out" 2> "$err" || ssh_status=$?
          report_status=0
          bash deploy/vds/gha-homework-pdf-inventory-report.sh "$out" "$err" "$ssh_status" || report_status=$?
          exit "$report_status"