symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    lifetime: '%env(int:RESET_PASSWORD_LIFETIME)%'
    # Secondary per-user guard; IP/e-mail rate limiters are the primary abuse controls.
    # New requests replace prior ones via removeRequests() before generateResetToken().
    throttle_limit: 60
    enable_garbage_collection: true

when@test:
    symfonycasts_reset_password:
        lifetime: 3600
        throttle_limit: 0
