framework:
    rate_limiter:
        anonymous_api:
            policy: 'fixed_window'
            limit: 100
            interval: '1 minute'

        email_verification_resend:
            policy: 'sliding_window'
            limit: 3
            interval: '15 minutes'

        # Used by security.login_throttling (factory name login).
        login:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

        password_reset_ip:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

        password_reset_email:
            policy: 'sliding_window'
            limit: 3
            interval: '15 minutes'

        password_reset_token:
            policy: 'fixed_window'
            limit: 20
            interval: '15 minutes'

when@test:
    framework:
        rate_limiter:
            email_verification_resend:
                policy: 'fixed_window'
                limit: 3
                interval: '1 minute'
            login:
                policy: 'fixed_window'
                limit: 3
                interval: '1 minute'
            password_reset_ip:
                policy: 'fixed_window'
                limit: 5
                interval: '1 minute'
            password_reset_email:
                policy: 'fixed_window'
                limit: 3
                interval: '1 minute'
            password_reset_token:
                policy: 'fixed_window'
                limit: 5
                interval: '1 minute'
