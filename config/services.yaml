# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(ALLOW_SUPER_ADMIN_BOOTSTRAP): '0'
    env(AUDIT_HASH_KEY): 'change-me-audit-hash-key-not-for-production'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\EmailVerificationSenderInterface: '@App\Service\EmailVerificationMailer'
    App\Service\PasswordResetNotifierInterface: '@App\Service\PasswordResetMailer'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        App\Service\UserFactory:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\UserGlobalRoleManager:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\UserStatusManager:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\EmailNormalizer:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\PersonNameNormalizer:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\RegistrationService:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\EmailVerificationService:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\EmailVerificationMailer:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\EmailVerificationSenderInterface: '@App\Service\EmailVerificationMailer'
        App\Service\UserAccountLifecycle:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\PasswordManager:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\PasswordResetMailer:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\PasswordResetNotifierInterface: '@App\Service\PasswordResetMailer'
        App\Service\RateLimitKeyHasher:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\SecurityAuditRecorder:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\SecurityAuditMetadataSanitizer:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\SecurityAuditHashGenerator:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\SuperAdminBootstrapService:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\InstitutionNameNormalizer:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\InstitutionCreator:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\InstitutionStatusManager:
            public: true
            autowire: true
            autoconfigure: true
        App\Service\InstitutionMembershipManager:
            public: true
            autowire: true
            autoconfigure: true
        App\Repository\UserRepository:
            public: true
            autowire: true
            autoconfigure: true
            tags: ['doctrine.repository_service']
        App\Repository\ResetPasswordRequestRepository:
            public: true
            autowire: true
            autoconfigure: true
            tags: ['doctrine.repository_service']
        App\Repository\SecurityAuditEventRepository:
