# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(ALLOW_SUPER_ADMIN_BOOTSTRAP): '0'
    env(AUDIT_HASH_KEY): 'change-me-audit-hash-key-not-for-production'
    env(QUESTION_ANSWER_INTEGRITY_KEY): 'change-me-question-answer-integrity-key-not-for-production'
    env(ATTEMPT_ANSWER_ENCRYPTION_KEY): '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    env(COMMERCE_IDEMPOTENCY_HASH_KEY): 'change-me-commerce-idempotency-hash-key-not-for-production'
    env(PAYMENT_SANDBOX_WEBHOOK_SIGNING_KEY): 'change-me-sandbox-webhook-signing-key-32b!!'
    env(PAYMENT_PLATFORM_SETTLEMENT_ACTOR_ID): ''
    env(PAYMENT_SANDBOX_PROVIDER_ENABLED): '1'
    env(PHONE_OTP_PEPPER): 'change-me-phone-otp-pepper-not-for-production-32b'
    env(PHONE_OTP_PEPPER_KEY_ID): 'v1'
    env(INVITATION_CODE_PEPPER): 'change-me-invitation-code-pepper-not-for-production-32b'
    env(INVITATION_CODE_PEPPER_KEY_ID): 'v1'
    payment_platform_settlement_actor_id_default: ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\LearningContent\Document\LearningDocumentStorage:
        arguments:
            $directory: '%kernel.project_dir%/var/learning-documents'

    App\Service\LearningDocumentManager:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Service\CatalogPublish\CatalogPublishTreeService:
        arguments:
            $afterTopicsHook: null

    App\Service\EmailVerificationSenderInterface: '@App\Service\EmailVerificationMailer'
    App\Service\PasswordResetNotifierInterface: '@App\Service\PasswordResetMailer'
    App\Security\InstitutionAuthorizationCacheInvalidator: '@App\Security\RequestScopedInstitutionAuthLookup'

    App\Doctrine\AcademicClassroomCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\CurriculumCourseCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\CurriculumTopicPositionScopeSchemaListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\QuestionBankCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\QuestionRevisionPrimaryAlignmentScopeSchemaListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\AssessmentCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\AssessmentDeliveryCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\AssessmentAttemptCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\AssessmentScoringCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\AssessmentResultReviewCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\LearningContentCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\LearningContentSchemaListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\AccessEntitlementCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\AccessEntitlementSchemaListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\CommerceCompositeForeignKeyListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\CommerceSchemaListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\OnboardingApplicationSchemaListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema }

    App\Doctrine\MariaDbUtcSessionTimezoneMiddleware:
        tags:
            - { name: doctrine.dbal.middleware }

    App\Commerce\Sandbox\SandboxWebhookSignatureVerifier:
        arguments:
            $signingKey: '%env(PAYMENT_SANDBOX_WEBHOOK_SIGNING_KEY)%'

    App\Commerce\Sandbox\SandboxPaymentProviderAdapter: ~

    App\Commerce\Sandbox\SandboxPaymentProviderReconciliationAdapter: ~

    app.payment_provider.sandbox_registration:
        class: App\Commerce\PaymentProviderRegistration
        arguments:
            $adapter: '@App\Commerce\Sandbox\SandboxPaymentProviderAdapter'
            $verifier: '@App\Commerce\Sandbox\SandboxWebhookSignatureVerifier'
            $parser: '@App\Commerce\Sandbox\SandboxWebhookParser'
            $enabled: '%env(bool:PAYMENT_SANDBOX_PROVIDER_ENABLED)%'
            $reconciliationAdapter: '@App\Commerce\Sandbox\SandboxPaymentProviderReconciliationAdapter'

    App\Commerce\PaymentProviderRegistry:
        arguments:
            $registrations:
                - '@app.payment_provider.sandbox_registration'

    App\Commerce\PaymentWebhookProcessingCheckpointInterface: '@App\Commerce\NullPaymentWebhookProcessingCheckpoint'

    App\Service\PaymentPlatformSettlementActorResolver:
        arguments:
            $settlementActorId: '%env(default:payment_platform_settlement_actor_id_default:PAYMENT_PLATFORM_SETTLEMENT_ACTOR_ID)%'
            $override: null

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\Admin\AdminSystemHealthReadModel:
        arguments:
            $migrations: '@doctrine.migrations.dependency_factory'

