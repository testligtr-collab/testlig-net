document:
  schemaVersion: 1
  blocks:
    - type: heading
      level: 2
      text: Eş Nesneleri Tanıyalım
    - type: paragraph
      text: Eş nesnelerin renk, biçim ve büyüklük gibi görsel özellikleri aynıdır. Nesneleri karşılaştırırken bu özelliklere birlikte bakarız.
    - type: callout
      variant: info
      blocks:
        - type: paragraph
          text: Yalnız rengin aynı olması yeterli değildir. Renkle birlikte biçim ve büyüklüğü de karşılaştırırız.
    - type: heading
      level: 2
      text: Nasıl Karşılaştırırız?
    - type: list
      items:
        - Renklerine bak.
        - Biçimlerine bak.
        - Büyüklüklerine bak.
        - Yönü değişmiş olsa da bu özellikler aynıysa nesneleri eş olarak değerlendir.
    - type: heading
      level: 2
      text: Birlikte Düşünelim
    - type: paragraph
      text: Bir nesne yana çevrilse de rengi, biçimi ve büyüklüğü aynı kaldıysa eşi olabilir. Büyük bir top ile küçük bir topun rengi ve biçimi aynı olsa bile büyüklükleri farklıysa eş değildir. Benzer görünmek, eş olmak demek değildir.
    - type: heading
      level: 2
      text: Hatırlayalım
    - type: callout
      variant: tip
      blocks:
        - type: paragraph
          text: Eş nesnelerin renk, biçim ve büyüklük gibi görsel özellikleri aynıdır. Nesnenin yalnızca yönü değişirse eşlik bozulmaz.
